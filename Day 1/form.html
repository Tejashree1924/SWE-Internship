<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #e6f4ea;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .form-container {
    background: #fff;
    max-width: 600px;
    width: 100%;
    padding: 40px;
    border-radius: 8px;
  }

  h1 {
    font-size: 1.8rem;
    color: #2b2c34;
    margin-bottom: 30px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .row {
    display: flex;
    gap: 20px;
  }

  .row .form-group {
    flex: 1;
  }

  label {
    display: block;
    font-size: 0.95rem;
    color: #2b2c34;
    margin-bottom: 8px;
  }

  .required {
    color: #0c7c59;
  }

  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #87909e;
    border-radius: 6px;
    font-size: 1rem;
    font-family: inherit;
  }

  textarea {
    resize: vertical;
    min-height: 100px;
  }

  input:focus,
  textarea:focus {
    outline: none;
    border-color: #0c7c59;
  }

  .radio-group {
    display: flex;
    gap: 20px;
  }

  .radio-option {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid #87909e;
    border-radius: 6px;
    padding: 12px;
    cursor: pointer;
  }

  .radio-option.selected {
    background: #e6f4ea;
    border-color: #0c7c59;
  }

  .radio-option input[type="radio"] {
    width: 18px;
    height: 18px;
    accent-color: #0c7c59;
  }

  .consent-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .consent-group input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #0c7c59;
  }

  .consent-group label {
    margin-bottom: 0;
  }

  button {
    width: 100%;
    background: #0c7c59;
    color: #fff;
    border: none;
    padding: 15px;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 25px;
  }

  button:hover {
    background: #0a6b4d;
  }

  @media (max-width: 500px) {
    .row {
      flex-direction: column;
      gap: 0;
    }
    .radio-group {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

  <div class="form-container">
    <h1>Contact Us</h1>
    <form id="contactForm">

      <div class="row">
        <div class="form-group">
          <label>First Name <span class="required">*</span></label>
          <input type="text" name="firstName" required>
        </div>
        <div class="form-group">
          <label>Last Name <span class="required">*</span></label>
          <input type="text" name="lastName" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email Address <span class="required">*</span></label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Query Type <span class="required">*</span></label>
        <div class="radio-group">
          <label class="radio-option" id="generalOption">
            <input type="radio" name="queryType" value="general" required>
            General Enquiry
          </label>
          <label class="radio-option" id="supportOption">
            <input type="radio" name="queryType" value="support">
            Support Request
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>Message <span class="required">*</span></label>
        <textarea name="message" required></textarea>
      </div>

      <div class="form-group consent-group">
        <input type="checkbox" id="consent" name="consent" required>
        <label for="consent">I consent to being contacted by the team <span class="required">*</span></label>
      </div>

      <button type="submit">Submit</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('contactForm');
    const generalOption = document.getElementById('generalOption');
    const supportOption = document.getElementById('supportOption');

    form.addEventListener('change', () => {
      generalOption.classList.toggle('selected', form.queryType.value === 'general');
      supportOption.classList.toggle('selected', form.queryType.value === 'support');
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Form submitted successfully!');
      form.reset();
      generalOption.classList.remove('selected');
      supportOption.classList.remove('selected');
    });
  </script>

</body>
</html>
