<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>User Management</h2>

        <div class="top-bar">

            <input
                type="text"
                id="search"
                placeholder="Search User..."
            >

            <button id="addBtn">
                + Add User
            </button>

        </div>

        <table>

            <thead>

                <tr>
                    <th>User Name</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>

</html>
